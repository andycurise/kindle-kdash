name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout
      # actions/setup-go v7.1.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        name: Set up Go
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Run native tests
        run: go test ./...

  shell:
    name: Shell syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout
      - name: Check POSIX shell syntax
        run: find scripts deploy/kindle -type f -name '*.sh' ! -path scripts/install.sh -exec sh -n {} \;
      - name: Check Bash installer syntax
        run: bash -n scripts/install.sh
      - name: Run strict ShellCheck on build tooling
        run: shellcheck scripts/build.sh scripts/package.sh scripts/install.sh scripts/test-install-local.sh scripts/test-server-local.sh
      - name: Run ShellCheck on deployment scripts
        # Preserve legacy deployment compatibility while checking every other
        # script at warning severity; build tooling remains fully strict above.
        run: find scripts deploy/kindle -type f -name '*.sh' ! -path scripts/build.sh ! -path scripts/package.sh -exec shellcheck --severity=warning --exclude=SC2034,SC2120 {} +

  powershell:
    name: PowerShell parser
    runs-on: windows-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout
      - name: Parse every installer script
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path deploy/win11 -Filter *.ps1 -File -Recurse)
          $files += Get-Item -Path scripts/install.ps1
          if ($files.Count -eq 0) { throw 'No PowerShell scripts found.' }
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $errors) {
                Write-Error "$($file.FullName): $($parseError.Message)"
              }
            }
          }
          if ($failed) { exit 1 }
      - name: Parse every installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(Get-ChildItem -Path deploy/win11 -Filter *.ps1 -File -Recurse)
          $files += Get-Item -Path scripts/install.ps1
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $errors) {
                Write-Error "$($file.FullName): $($parseError.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

  packages:
    name: Four targets and release archives
    needs: [go, shell, powershell]
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout
      # actions/setup-go v7.1.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        name: Set up Go
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all targets and create packages
        run: ./scripts/package.sh
      - name: Run offline HTTP process smoke tests
        run: ./scripts/test-server-local.sh
      - name: Verify version, archive layout, and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          test "$version" = "$(./build/kdash-linux-amd64 -version)"
          kual_version="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' deploy/kindle/extensions/kdash/config.xml | head -n 1)"
          test "$kual_version" = "$version"

          archives=(
            kdash-windows-amd64.zip
            kdash-darwin-arm64.tar.gz
            kdash-linux-amd64.tar.gz
            kdash-linux-arm64.tar.gz
            kdash-kindle-pw2.zip
          )
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 8
          test -f dist/install.sh
          test -f dist/install.ps1
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          awk 'NF != 2 || $2 ~ /\// { exit 1 }' dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

          listing="$RUNNER_TEMP/kdash-archive-files.txt"
          require_entry() {
            grep -Fqx "$1" "$listing" || {
              printf 'Missing archive entry: %s\n' "$1" >&2
              exit 1
            }
          }
          for archive in "${archives[@]}"; do
            test -f "dist/$archive"
            case "$archive" in
              *.zip)
                root="${archive%.zip}"
                unzip -Z1 "dist/$archive" > "$listing"
                ;;
              *.tar.gz)
                root="${archive%.tar.gz}"
                tar -tzf "dist/$archive" > "$listing"
                ;;
            esac
            awk -v prefix="$root/" 'index($0, prefix) != 1 || $0 ~ /(^|\/)\.\.(\/|$)/ { exit 1 }' "$listing"
            require_entry "$root/LICENSE"
            require_entry "$root/THIRD_PARTY_NOTICES.md"
            require_entry "$root/assets/fonts/licenses/NotoSansSC-OFL.txt"
            require_entry "$root/README.md"
            case "$archive" in
              kdash-windows-amd64.zip)
                require_entry "$root/kdash.exe"
                require_entry "$root/kdash.json.example"
                require_entry "$root/install_task.ps1"
                ;;
              kdash-darwin-arm64.tar.gz)
                require_entry "$root/kdash"
                require_entry "$root/kdash.json.example"
                require_entry "$root/com.kdash.agent.plist"
                ;;
              kdash-linux-*.tar.gz)
                require_entry "$root/kdash"
                require_entry "$root/kdash.json.example"
                require_entry "$root/kdash.service"
                ;;
              kdash-kindle-pw2.zip)
                require_entry "$root/kdash/client.conf"
                require_entry "$root/kdash/sync-screen.sh"
                require_entry "$root/extensions/kdash/config.xml"
                cmp deploy/kindle/client.conf.example \
                  <(unzip -p "dist/$archive" "$root/kdash/client.conf")
                ;;
            esac
          done

  installer-macos:
    name: macOS local installer (fake launchctl)
    runs-on: macos-15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout
      # actions/setup-go v7.1.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        name: Set up Go
        with:
          go-version-file: go.mod
          cache: true
      - name: Build packages for installer tests
        run: ./scripts/package.sh
      - name: Test install, upgrade, checksum failure, and uninstall
        run: ./scripts/test-install-local.sh
